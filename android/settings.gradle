// repo1.maven.org is Maven Central itself (the same artifacts mavenCentral() serves).
pluginManagement {
    repositories {
        google()
        maven { url = uri("https://repo1.maven.org/maven2/") }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = uri("https://repo1.maven.org/maven2/") }
    }
}
rootProject.name = "IQ POS Till"
include ':app'

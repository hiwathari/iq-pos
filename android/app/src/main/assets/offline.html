<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IQ POS Till</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f5f4; font-family: -apple-system, Roboto, "Segoe UI", sans-serif; color: #1c1917; }
  main { text-align: center; padding: 32px; max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #57534e; margin: 0 0 24px; line-height: 1.5; }
  button { font-size: 18px; font-weight: 600; padding: 14px 32px; border: 0; border-radius: 14px; background: #c2410c; color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Can't reach the Till</h1>
  <p>Check the tablet's Wi-Fi or mobile data. The Till will open as soon as the connection is back.</p>
  <button onclick="IQPOSApp.reload()">Try again</button>
</main>
<script>
  // Try again by itself every few seconds.
  setInterval(function () { try { IQPOSApp.reload(); } catch (e) {} }, 8000);
</script>
</body>
</html>
